<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Akademia Holy Five — taktyki, mapy i pozycje CS2. Kompendium zagrań i ustawień od ekipy 221.">
    <link rel="stylesheet" href="/features/holyfive/holyfive.css">
    <link rel="stylesheet" href="/features/holyfive/akademia.css">
    <link rel="stylesheet" href="/shared/css/view-transition.css">
    <link rel="icon" href="holyfive.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Esteban&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Qwitcher+Grypen:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <title>Akademia | Holy Five — taktyki i mapy CS2</title>    
    <script defer src="/shared/scripts/refresh-redirect-to-pages-index.js"></script>
    <script src="/shared/scripts/site-view-transition.js" defer></script>
</head>
<body>
    
    <div class="loading-container enter-transition" id="loadingScreen">
        <div class="loading-logo">
            <img src="hflogo5.webp" alt="LogoHF">
        </div>
        <div class="loading-label"><span class="blood-text">LOADING</span><span class="blood-dot">.</span><span class="blood-dot">.</span><span class="blood-dot">.</span></div>
    </div>
    
        <div class="content hidden" id="pageContent">
            <div class="academy-banner">
                <canvas id="res-canvas" aria-hidden="true"></canvas>
                <div data-include="header" class="academy-header-slot"></div>
                <div class="academy-banner-content">
                    <div id="akademiaTitle" class="academy-title" aria-hidden="true"></div>
                    <div class="academy-subtitle academy-subtitle--lead shimmering-text">
                        MATERIAŁY TRENINGOWE HOLY FIVE
                    </div>
                </div>
                <div class="blood-drip"></div>
            </div>
        
        <style>
            @keyframes fadeIn {
                0% {
                    opacity: 0;
                }
                100% {
                    opacity: 1;
                }
            }
            
            @keyframes pulseEffect {
                0% { transform: scale(1); color: #e0e0e0; }
                50% { transform: scale(1.01); color: #ffffff; }
                100% { transform: scale(1); color: #e0e0e0; }
            }
            
            @keyframes shimmer {
                0% { background-position: -200% 0; }
                100% { background-position: 200% 0; }
            }
            
            .shimmering-text {
                color: #e8e8e8;
                text-shadow: 0 0 1px #fff;
                font-weight: 800;
                position: relative;
                background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
                background-size: 200% 100%;
                background-repeat: no-repeat;
                -webkit-background-clip: text;
                background-clip: text;
                color: rgba(255, 255, 255, 0.85);
                animation: shimmer 5s infinite linear;
            }
            
        </style>
        
        <main>
            <!-- Nowy poziomy układ map -->
            <div class="maps-horizontal-layout">
                <div class="map-panel" data-map="map" data-index="1">
                    <div class="blood-corner"></div>
                    <div class="map-panel-content">
                        <h2 class="map-panel-title">ZASADY</h2>
                        <div class="map-panel-number">1</div>
                        <div class="map-panel-image"></div>
                    </div>
                </div>
                
                <div class="map-panel" data-map="nuke" data-index="2">
                    <div class="blood-corner"></div>
                    <div class="map-panel-content">
                        <h2 class="map-panel-title">NUKE</h2>
                        <div class="map-panel-number">2</div>
                        <div class="map-panel-image"></div>
                    </div>
                </div>
                
                <div class="map-panel" data-map="ancient" data-index="3">
                    <div class="blood-corner"></div>
                    <div class="map-panel-content">
                        <h2 class="map-panel-title">ANCIENT</h2>
                        <div class="map-panel-number">3</div>
                        <div class="map-panel-image"></div>
                    </div>
                </div>
                
                <div class="map-panel" data-map="dust" data-index="4">
                    <div class="blood-corner"></div>
                    <div class="map-panel-content">
                        <h2 class="map-panel-title">DUST 2</h2>
                        <div class="map-panel-number">4</div>
                        <div class="map-panel-image"></div>
                    </div>
                </div>
            </div>
            
            <!-- Pełnoekranowy overlay: tylko obraz wybranej karty + napisy (bez modala i paneli) -->
            <div id="rulesFullscreenOverlay" class="rules-fullscreen-overlay" aria-hidden="true">
                <div class="rules-fullscreen-images">
                    <img id="rulesFullscreenImg" class="rules-fullscreen-img" src="" alt="" />
                </div>
                <div class="rules-fullscreen-content"></div>
                <button type="button" class="rules-fullscreen-close" aria-label="Zamknij">×</button>
            </div>

            <!-- Nowe modalne okno dla map -->
            <div id="mapModal" class="map-modal">
                <div class="map-modal-content">
                    <div class="map-modal-header">
                        <h2 id="mapModalTitle">Tablica</h2>
                        <span class="map-modal-close">&times;</span>
                    </div>
                    <div class="map-modal-body">
                        <!-- Zawartość mapy zostanie dodana dynamicznie -->
                    </div>
                </div>
            </div>
            
            <div class="page-content hidden-containers">
                <!-- Zachowujemy oryginalne kontenery map, ale ukryte -->
                <section class="map-section">
                    <h2 class="section-title hidden-title">Tablica <i class="fas fa-chevron-down toggle-map collapsed" id="mapToggle" aria-label="Rozwiń/zwiń mapę"></i></h2>
                    <div class="map-container collapsed" id="mapContainer">
                        <div class="map-left-section"></div>
                        <div class="map-right-section">
                            <h3 class="maps-title">Mapy</h3>
                            <div class="maps-list">
                                <button class="map-button" data-map="mirage">Mirage</button>
                                <button class="map-button" data-map="inferno">Inferno</button>
                                <button class="map-button" data-map="nuke">Nuke</button>
                                <button class="map-button" data-map="ancient">Ancient</button>
                                <button class="map-button" data-map="dust2">Dust 2</button>
                                <button class="map-button" data-map="anubis">Anubis</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="map-section">
                    <h2 class="section-title hidden-title">Nuke <i class="fas fa-chevron-down toggle-map collapsed" id="nukeToggle" aria-label="Rozwiń/zwiń mapę"></i></h2>
                    <div class="map-container collapsed" id="nukeContainer">
                        <p class="map-info">Taktyki na mapie Nuke zostaną wkrótce dodane.</p>
                    </div>
                </section>

                <section class="map-section">
                    <h2 class="section-title hidden-title">Ancient <i class="fas fa-chevron-down toggle-map collapsed" id="ancientToggle" aria-label="Rozwiń/zwiń mapę"></i></h2>
                    <div class="map-container collapsed" id="ancientContainer">
                        <p class="map-info">Taktyki na mapie Ancient zostaną wkrótce dodane.</p>
                    </div>
                </section>

                <section class="map-section">
                    <h2 class="section-title hidden-title">Dust 2 <i class="fas fa-chevron-down toggle-map collapsed" id="dustToggle" aria-label="Rozwiń/zwiń mapę"></i></h2>
                    <div class="map-container collapsed" id="dustContainer">
                        <p class="map-info">Taktyki na mapie Dust 2 zostaną wkrótce dodane.</p>
                    </div>
                </section>
            </div>
        </main>
        
        <div data-include="footer"></div>
    </div>
    
    <div data-include="menu-overlay"></div>

    <!-- Skrypty ładowane na końcu dla lepszej wydajności -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="include.js" defer></script>
    <script type="module" src="/features/holyfive/academy-perlin-bg.js"></script>
    <script src="/features/holyfive/holyfive.js"></script>
    <script src="/features/holyfive/akademia.js" defer></script>
</body>
</html>
